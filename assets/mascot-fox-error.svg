    <path fill="#563C39" stroke-width="4" d="M185 148h35c6 0 9 3 9 7v2h-43c-6 0-7-5-1-9z"/>
    <path fill="#E98545" d="M119 87c33-17 88-15 120 2 17 9 23 23 17 38-6 14-23 19-44 17l-92-6c-18-1-27-10-25-25 1-11 9-20 24-26z"/>
    <path fill="#FFF0D7" stroke-width="4.5" d="M130 126c29 8 69 10 105 4-8 13-27 17-48 15l-44-4c-14-1-20-8-17-15z"/>
    <path fill="#D96F3C" d="M140 101c-8 12-18 22-32 31l-18 13 15 3 28-12 17-18z"/>
    <path fill="#563C39" stroke-width="4" d="M87 147c10-3 20-2 27 3 4 3 4 7-1 9H79c-6 0-8-5-3-8z"/>
    <!-- Rounded side-profile head, one ear and one eye -->
    <path fill="#E98545" d="M92 83l9-49c2-10 10-12 15-2l19 42c15 3 25 14 25 31 0 18-15 31-36 35-11 10-29 15-52 15H50c-9 0-13-6-8-12 5-7 18-12 28-21 12-11 16-26 12-39z"/>
