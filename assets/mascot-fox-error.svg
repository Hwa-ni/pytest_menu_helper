<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" role="img" aria-labelledby="title desc">
  <title id="title">pytest Menu Helper fox mascot, failed test</title>
  <desc id="desc">A relaxed side-view fox lies on its belly with its muzzle resting on the floor.</desc>
  <style>
    .fox { animation: flop 480ms cubic-bezier(.35, .05, .45, 1) 1 both; transform-box: view-box; transform-origin: 160px 155px; }
    @keyframes flop {
      0% { transform: translateY(-9px) rotate(-2deg); }
      62% { transform: translateY(2px) rotate(.7deg); }
      100% { transform: translateY(0) rotate(0); }
    }
    @media (prefers-reduced-motion: reduce) { .fox { animation: none; } }
  </style>
  <ellipse cx="160" cy="160" rx="127" ry="4" fill="#563C39" opacity=".12"/>
  <path d="M15 156h290" fill="none" stroke="#B9A69B" stroke-width="2" opacity=".65"/>
  <g class="fox" stroke="#563C39" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tail -->
    <path fill="#E98545" d="M243 99c17-16 40-17 50-2 10 14 2 31-14 36-14 4-28-4-39-16l-12-10z"/>
    <path fill="#FFF0D7" stroke-width="4" d="M273 90c10 1 17 8 17 16 0 7-5 13-12 15-1-11-5-21-13-28z"/>
    <!-- Relaxed body and folded legs -->
