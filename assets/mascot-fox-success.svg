<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">pytest Menu Helper fox mascot, success</title>
  <desc id="desc">A friendly orange fox testing companion celebrates with repeated little jumps.</desc>
  <style>
    .fox { animation: celebrate 1100ms cubic-bezier(.35, 0, .4, 1) infinite; transform-box: fill-box; transform-origin: center bottom; }
    .tail { animation: cheer-tail 650ms ease-in-out infinite; transform-box: fill-box; transform-origin: 96% 48%; }
    .leg-a { animation: tuck-a 1100ms ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 5%; }
    .leg-b { animation: tuck-b 1100ms ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 5%; }
    .sparkles { animation: sparkle 850ms ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes celebrate { 0%, 100% { transform: translateY(0) scale(1); } 28% { transform: translateY(-8px) scale(1.02); } 48% { transform: translateY(0) scale(1.04, .92); } 66% { transform: translateY(-3px) scale(1); } }
    @keyframes cheer-tail { 0%, 100% { transform: rotate(-20deg); } 50% { transform: rotate(20deg); } }
    @keyframes tuck-a { 0%, 25%, 100% { transform: rotate(0); } 42%, 62% { transform: rotate(-24deg); } }
    @keyframes tuck-b { 0%, 25%, 100% { transform: rotate(0); } 42%, 62% { transform: rotate(24deg); } }
    @keyframes sparkle { from { opacity: .45; transform: scale(.8); } to { opacity: 1; transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) {
      .fox, .tail, .leg-a, .leg-b, .sparkles { animation: none; }
    }
  </style>
  <g class="fox" stroke="#563C39" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
