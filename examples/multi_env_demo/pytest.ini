# multi_env_demo 전용 pytest 설정.
#
# 왜 이 폴더에 따로 두는가:
#   pytest는 실행 인수(없으면 현재 폴더)에서 위로 올라가며 처음 만난 설정 파일을 쓴다.
#   이 파일이 없으면 저장소 루트의 pyproject.toml([tool.pytest.ini_options] testpaths = ["tests"])이
#   설정 파일이 되고 rootdir도 저장소 루트가 된다. 그러면
#     1) 아래 conflict 마커 등록과 기본 제외(addopts)를 저장소 설정에 넣어야 해서
#        저장소의 플러그인 테스트(tests/)에도 이 샘플 전용 옵션이 끼어든다.
#     2) .pytest_cache가 저장소 루트에 생겨 다른 샘플·저장소 테스트와 한 캐시를 나눠 쓴다.
#        이 샘플은 동시 실행 때 .pytest_cache가 버티는지 보려는 것이라 캐시 위치가 샘플 안이어야 한다.
#   pytest.ini는 [pytest] 절이 있으면 항상 설정 파일로 인정되므로(pyproject.toml보다 먼저 찾음)
#   이 폴더가 rootdir가 된다. 저장소 루트에서 `pytest examples/multi_env_demo`로 실행해도 같다.
#
# 주의: 이 설정은 이 폴더 안에서만 효과가 있다. 저장소 루트에서 인수 없이 `pytest`를 돌리면
#   저장소 pyproject.toml의 testpaths 때문에 tests/만 수집되고 이 샘플은 돌지 않는다.
[pytest]
markers =
    conflict: 동시 실행 때 서로 부딪히는 나쁜 예(test_shared_bad.py). 기본 실행에서 빠진다. 켜려면 -m conflict
# 기본 실행에서 나쁜 예를 뺀다. 명령줄의 -m conflict가 addopts보다 뒤에 붙어 이 값을 덮어쓴다.
# -m 대신 파일 자체를 수집에서 빼면(collect_ignore) 켜는 방법이 conftest 옵션으로 복잡해져서 마커를 쓴다.
addopts = -m "not conflict"
